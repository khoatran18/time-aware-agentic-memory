app:
  name: "Time-Aware Agentic Memory"
  env: "dev"                      # loader kiểm tra khớp với APP_ENV, lệch thì cảnh báo
  version: "0.1.0"

# ================================================================
# LLM - profiles: tên dễ nhớ -> provider + model_id
# api_key để dạng ${VAR:-}: thiếu thì để trống, lỗi chỉ báo khi profile đó thực sự được dùng
# ================================================================
llm:
  profiles:
    claude_haiku:
      provider: "anthropic"
      model_id: "claude-haiku-5-5"
      api_key: "${ANTHROPIC_API_KEY:-}"
      temperature: 0
    claude_sonnet:
      provider: "anthropic"
      model_id: "claude-sonnet-5-5"
      api_key: "${ANTHROPIC_API_KEY:-}"
      temperature: 0
    gpt_mini:
      provider: "openai"
      model_id: "<điền model id>"
      api_key: "${OPENAI_API_KEY:-}"
      temperature: 0
    local_llama:
      provider: "ollama"
      model_id: "<điền model id>"
      base_url: "${OLLAMA_URL:-http://localhost:11434}"
    9router:                           # proxy tương thích OpenAI, dùng provider "openai" + base_url
      provider: "openai"
      model_id: "basic-gemini-3.5-flash-lite"   # combo 9router chỉ chứa một model Gemini; lỗi thì chờ 1 đến 32 giây (tam/llm/structured.py)
      api_key: "${NINE_ROUTER_API_KEY:-}"
      base_url: "${NINE_ROUTER_URL:-http://localhost:20128/v1}"   # cổng mặc định chưa kiểm chứng, xem dashboard 9router
      temperature: 0
    9router_31:                        # combo 9router chứa Gemini 3.1 flash-lite (quota ngày riêng, tách với 3.5)
      provider: "openai"
      model_id: "basic-gemini-3.1-flash-lite"
      api_key: "${NINE_ROUTER_API_KEY:-}"
      base_url: "${NINE_ROUTER_URL:-http://localhost:20128/v1}"
      temperature: 0
    google_35:                         # Gemini 3.5 gọi thẳng API Google (structured output do Google ép khuôn); đổi role sang đây để dùng
      provider: "google"
      model_id: "gemini-3.5-flash-lite"
      api_key: "${GOOGLE_API_KEY:-}"
      temperature: 0
      cache_model: "basic-gemini-3.5-flash-lite"   # cùng model với profile 9router: dùng lại cache; bỏ dòng này nếu muốn tách cache
    google_31:                         # Gemini 3.1 gọi thẳng
      provider: "google"
      model_id: "gemini-3.1-flash-lite"
      api_key: "${GOOGLE_API_KEY:-}"
      temperature: 0
      cache_model: "basic-gemini-3.1-flash-lite"
  # mỗi chỗ gọi LLM trỏ tới một tên profile ở trên
  roles:
    time_extractor: "google_31"        # Profiler dùng Gemini 3.1 gọi thẳng Google; nạp kho giữ 3.5 qua 9router cho nhất quán với bộ local
    ingestion_time: "google_35"        # nạp kho dùng Gemini 3.5 gọi thẳng Google; cache_model giữ cache cũ của combo 9router
    router: "claude_haiku"
    generation: "claude_sonnet"
    judge: "claude_sonnet"

# ================================================================
# Embedding
# ================================================================
embedding:
  # profiles: tên dễ nhớ -> provider + model_id, chia theo loại
  profiles:
    dense:                              # vector ngữ nghĩa
      bge_small_en:                     # 384 chiều, tiếng Anh, nhẹ
        provider: "fastembed"
        model_id: "BAAI/bge-small-en-v1.5"
        # cache_dir: "data/models"      # mặc định fastembed dùng thư mục tạm của hệ thống
      bge_base_en:                      # 768 chiều, tốt hơn nhưng chậm hơn
        provider: "fastembed"
        model_id: "BAAI/bge-base-en-v1.5"
    sparse:                             # vector từ khóa
      bm25:
        provider: "fastembed"
        model_id: "Qdrant/bm25"
  # chọn profile đang dùng (tên nằm trong profiles.dense / profiles.sparse).
  # Đổi dense -> số chiều đổi -> phải tạo lại collection
  dense: "bge_small_en"
  sparse: "bm25"

# ================================================================
# Qdrant
# ================================================================
vector_store:
  url: "${QDRANT_URL:-http://localhost:6333}"
  api_key: "${QDRANT_API_KEY:-}"
  collection: "tam_chunks_dev"

# ================================================================
# Retrieval (Cơ chế 1)
# ================================================================
retrieval:
  w1: 0.7
  w2: 0.3
  decay_lambda: 0.5
  rrf_k: 60
  top_n: 50
  top_k: 5
  w3: 0.0                # trọng số Domain_Match (cộng điểm); 0 = tắt
  end_mode: "stored"     # cách chấm chunk ongoing/unknown: stored (C) | open (A) | decay (B) | unknown_decay (chỉ unknown giảm dần); xem decisions/02, 06
  open_decay: 0.1        # chỉ dùng khi end_mode = decay hoặc unknown_decay
  decay_from: "start"     # mốc tính khoảng cách của chunk đã hết hạn (TH2): start (design 02) | end (decisions/07, đang thử)
  time_mode: "point"      # point: một điểm t_req (design 02) | range: khoảng [t_req, t_end] (decisions/07 đề xuất 1; cần Profiler khoảng)
  overlap: "binary"      # chỉ với time_mode = range: binary (giao nhau = 1.0) | coverage (độ phủ |C ∩ Q| / |Q|)
  t_unknown: null        # điểm thời gian của chunk không mốc (vd 0.5); null = tắt nhánh này (decisions/04)
  sparse_weight: 1.0     # trọng số nhánh BM25 trong RRF (dense luôn 1); 0 = bỏ BM25 (docs/eval/04, đợt 1b)
  neighbor_window: 0     # số chunk liền kề mỗi phía lấy làm ngữ cảnh; 0 = tắt
  page_expand: "none"    # mở rộng cùng trang (decisions/07 đề xuất 7): none | time (còn hợp lệ theo thời gian) | page (đối chứng, không lọc thời gian)
  page_top: 3            # số trang (theo Top-K) được mở rộng
  page_per: 2            # số chunk thêm tối đa mỗi trang

# ================================================================
# Evaluation
# ================================================================
evaluation:
  subset: "local"

# ================================================================
# Logging
# ================================================================
logging:
  level: "DEBUG"
  format: "text"
  log_dir: "output"               # thư mục gốc chứa các thư mục theo lần chạy (tính từ gốc project)
  file_name: "run.log"
  module_levels:                  # hạ mức log của thư viện ồn
    httpx: "WARNING"
    qdrant_client: "WARNING"
