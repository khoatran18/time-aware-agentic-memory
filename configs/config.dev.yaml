app:
  name: "Time-Aware Agentic Memory"
  env: "dev"                      # loader kiểm tra khớp với APP_ENV, lệch thì cảnh báo
  version: "0.1.0"

# ================================================================
# LLM - profiles: tên dễ nhớ -> provider + model_id
# api_key để dạng ${VAR:-}: thiếu thì để trống, lỗi chỉ báo khi profile đó thực sự được dùng
# ================================================================
llm:
  profiles:
    claude_haiku:
      provider: "anthropic"
      model_id: "claude-haiku-5-5"
      api_key: "${ANTHROPIC_API_KEY:-}"
      temperature: 0
    claude_sonnet:
      provider: "anthropic"
      model_id: "claude-sonnet-5-5"
      api_key: "${ANTHROPIC_API_KEY:-}"
      temperature: 0
    gpt_mini:
      provider: "openai"
      model_id: "<điền model id>"
      api_key: "${OPENAI_API_KEY:-}"
      temperature: 0
    local_llama:
      provider: "ollama"
      model_id: "<điền model id>"
      base_url: "${OLLAMA_URL:-http://localhost:11434}"
  # mỗi chỗ gọi LLM trỏ tới một tên profile ở trên
  roles:
    time_extractor: "claude_haiku"
    ingestion_time: "claude_haiku"
    router: "claude_haiku"
    generation: "claude_sonnet"
    judge: "claude_sonnet"

# ================================================================
# Embedding
# ================================================================
embedding:
  # profiles: tên dễ nhớ -> provider + model_id, chia theo loại
  profiles:
    dense:                              # vector ngữ nghĩa
      bge_small_en:                     # 384 chiều, tiếng Anh, nhẹ
        provider: "fastembed"
        model_id: "BAAI/bge-small-en-v1.5"
        # cache_dir: "data/models"      # mặc định fastembed dùng thư mục tạm của hệ thống
      bge_base_en:                      # 768 chiều, tốt hơn nhưng chậm hơn
        provider: "fastembed"
        model_id: "BAAI/bge-base-en-v1.5"
    sparse:                             # vector từ khóa
      bm25:
        provider: "fastembed"
        model_id: "Qdrant/bm25"
  # chọn profile đang dùng (tên nằm trong profiles.dense / profiles.sparse).
  # Đổi dense -> số chiều đổi -> phải tạo lại collection
  dense: "bge_small_en"
  sparse: "bm25"

# ================================================================
# Qdrant
# ================================================================
vector_store:
  url: "${QDRANT_URL:-http://localhost:6333}"
  api_key: "${QDRANT_API_KEY:-}"
  collection: "tam_chunks_dev"

# ================================================================
# Retrieval (Cơ chế 1)
# ================================================================
retrieval:
  w1: 0.7
  w2: 0.3
  decay_lambda: 0.5
  rrf_k: 60
  top_n: 50
  top_k: 5

# ================================================================
# Evaluation
# ================================================================
evaluation:
  subset: "local"

# ================================================================
# Logging
# ================================================================
logging:
  level: "DEBUG"
  format: "text"
  log_dir: "output"               # thư mục gốc chứa các thư mục theo lần chạy (tính từ gốc project)
  file_name: "run.log"
  module_levels:                  # hạ mức log của thư viện ồn
    httpx: "WARNING"
    qdrant_client: "WARNING"
